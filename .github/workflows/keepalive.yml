name: Keep Supabase Alive

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Supabase
        run: |
          curl -L -X GET "SUPABASE_PROJECT_URL}/rest/v1/appointments?select=id&limit=1" \
          -H "apikey:SUPABASE_PUBLISHABLE_KEY" \
          -H "Authorization: Bearer SUPABASE_PUBLISHABLE_KEY"